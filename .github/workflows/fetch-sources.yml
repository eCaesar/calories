name: Скачать открытые таблицы (USDA)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q xlrd && python3 scripts/fetch_usda.py
      - name: Сохранить в ветку sources
        run: |
          cd sources
          git init -q -b sources
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "USDA FoodData Central" 
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" sources
