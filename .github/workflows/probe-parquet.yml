name: Разведка Parquet OFF
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q duckdb
      - name: Схема и пример
        run: |
          python3 - <<'PY'
          import duckdb
          con = duckdb.connect()
          con.execute("INSTALL httpfs; LOAD httpfs;")
          url = "https://huggingface.co/datasets/openfoodfacts/product-database/resolve/main/food.parquet"
          schema = con.execute(f"DESCRIBE SELECT * FROM read_parquet('{url}')").fetchall()
          cols = {r[0]: r[1] for r in schema}
          for k in ["code", "product_name", "brands", "countries_tags", "nutriments", "serving_quantity", "lang", "stores_tags"]:
              print(f"::error::{k}: {str(cols.get(k))[:400]}")
          print("::error::all columns: " + ", ".join(cols)[:900])
          row = con.execute(f"SELECT code, product_name, nutriments FROM read_parquet('{url}') WHERE list_contains(countries_tags, 'en:russia') LIMIT 1").fetchone()
          print("::error::sample: " + str(row)[:900])
          PY
