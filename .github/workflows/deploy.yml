name: Сборка базы и публикация

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # раз в неделю обновляем базу товаров
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Номер недели
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Кэш базы товаров (на неделю)
        id: cache
        uses: actions/cache@v4
        with:
          path: data/
          key: off-ru-${{ hashFiles('scripts/build_off_ru.py') }}-${{ steps.week.outputs.week }}

      - name: Собрать базу из Open Food Facts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q duckdb
          python3 scripts/build_off_ru.py
          ls -lh data/

      - name: Подготовить сайт
        run: |
          mkdir -p _site/data
          cp -r index.html app.js sync.js foods.js foods-extra.js manifest.json sw.js icon.svg icon-192.png icon-512.png fonts _site/
          cp data/off-ru.json data/stats.json _site/data/ 2>/dev/null || cp data/off-ru.json _site/data/

      - name: Опубликовать в ветку gh-pages
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Публикация ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
