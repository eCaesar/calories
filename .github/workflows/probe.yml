name: Разведка источников
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in yvfu/FoodData_Central_csv_2025-04-24 french-open-data/table-de-composition-nutritionnelle-des-aliments-ciqual-2020 tramzel/fndds; do
            r=$(curl -s "https://huggingface.co/api/datasets/$d/tree/main?recursive=true" | jq -r '.[] | select(.type=="file") | "\(.path):\(.size)"' | head -60 | tr '\n' ' ')
            echo "::notice::$d => $r"
          done
